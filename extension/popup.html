<!--
  ============================================================================
  Search Engine Converter v2.3.0 - Popup Interface
  ============================================================================

  @file        popup.html
  @description Interfaz del popup: un unico flujo contextual. La fila de
               busqueda se autorellena con la busqueda detectada (o queda
               vacia para escribir una nueva) y la rejilla de motores ejecuta
               la conversion/busqueda. Toda la configuracion vive en
               options.html.

  @author      @686f6c61
  @repository  https://github.com/686f6c61/chrome-search-engine-converter
  @license     MIT License
  ============================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Search Engine Converter</title>
  <link rel="stylesheet" href="css/fontawesome.min.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Compact header: logo, live status chip, options -->
  <div class="popup-bar">
    <i class="fas fa-exchange-alt popup-logo" aria-hidden="true" data-i18n-title="appTitle"></i>
    <p id="statusChip" class="status-chip" role="status" aria-live="polite"></p>
    <button id="copyUrlButton" class="icon-button" type="button" data-i18n-aria="tooltipCopy" data-i18n-title="tooltipCopy">
      <i class="fas fa-copy" aria-hidden="true"></i>
    </button>
    <button id="openOptionsButton" class="icon-button" type="button" data-i18n-aria="openOptions" data-i18n-title="openOptions">
      <i class="fas fa-cog" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Single search box: prefilled with the detected query, editable -->
  <div class="search-input-wrapper">
    <i class="fas fa-search search-icon" aria-hidden="true"></i>
    <input type="text" id="quickSearchInput" data-i18n-placeholder="searchPlaceholder" />
    <button id="clearSearchButton" class="clear-button" type="button" data-i18n-aria="clearSearch" data-i18n-title="clearSearch">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Engine grid (generated dynamically from engines.js, ordered by config) -->
  <div class="search-buttons" id="engineGrid"></div>

  <!-- Minimal footer -->
  <div class="footer">
    <span id="versionLabel"></span> · <a href="https://github.com/686f6c61/chrome-search-engine-converter" target="_blank" rel="noopener noreferrer" data-i18n="githubLink">GitHub</a>
  </div>

  <!-- Scripts: popup.js importa engines.js, config.js y ui.js como modulos ES -->
  <script type="module" src="popup.js"></script>
</body>
</html>
